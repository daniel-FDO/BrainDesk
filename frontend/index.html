<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BrainDesk — organise notes, topics and focused study sessions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block"
    />
    <meta name="color-scheme" content="light dark" />
    <title>BrainDesk</title>
    <style>
      /* Same purple as the splash, so there's no white flash before the app loads. */
      #root:empty {
        min-height: 100vh;
        background: linear-gradient(160deg, #3e2e64 0%, #261c40 100%);
      }
    </style>
    <script>
      // Apply the saved theme before first paint (same rules as src/lib/theme.ts).
      ;(function () {
        var t
        try {
          t = JSON.parse(localStorage.getItem('braindesk.theme'))
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
